{% extends "admin/base_site.html" %}

{% block content %}
    <form action="" method="post">
        {% csrf_token %}
        {{ form }}
        <input type="submit" name="submit" value="Deduplicate"/>
        {% if results %}
            <table>
                <thead>
                <th>Threshold</th>
                <th>Duplicate Count</th>
                </thead>
                <tbody>
                {% for result in results %}
                    <tr>
                        <td>{{ result.threshold }}</td>
                        <td>{{ result.count }}</td>
                    </tr>
                {% endfor %}
                </tbody>
            </table>
        {% endif %}
    </form>
{% endblock content %}
