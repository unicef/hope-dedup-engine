[tox]
requires =
    tox>=4.2
    tox-gh-actions
    tox-uv>=1.20.2
env_list =
    lint
    pkg_meta
    d{52}-py{312}
skip_missing_interpreters = true

[testenv]
pass_env =
    CACHE_DEFAULT
    DATABASE_URL
    STATIC_ROOT
    STATIC_URL
set_env =
    ADMIN_EMAIL = adm@test.com
    ADMIN_PASSWORD = testpassword
    ALLOWED_HOSTS = localhost,127.0.0.1
    AUTHENTICATION_BACKENDS =
    CACHE_URL = locmem://
    CELERY_BROKER_URL = redis://localhost:6379/9
    CELERY_TASK_ALWAYS_EAGER = True
    CRYPTOGRAPHY_DONT_BUILD_RUST = 1
    CSRF_COOKIE_SECURE = False
    DATABASE_URL = sqlite:///db.sqlite3
    DEBUG = False
    DEEPFACE_HOME = {envtmpdir}/.deepface
    DJANGO_ADMIN_URL = admin
    DJANGO_SETTINGS_MODULE = hope_dedup_engine.config.settings
    PYTHONPATH = .
    SECRET_KEY = versy-super-secret-test-key
commands =
    pytest tests -rw --create-db -x --cov=hope_dedup_engine --cov-report=term-missing --cov-report=html --cov-report=xml
dependency_groups = dev

[testenv:lint]
description = run static analysis and style check using ruff
skip_install = true
deps =
    pre-commit-uv>=4.1.1
pass_env =
    HOMEPATH
    PROGRAMDATA
commands =
    pre-commit run --all-files --show-diff-on-failure

[testenv:pkg_meta]
description = check that the long description is valid
skip_install = true
deps =
    check-wheel-contents>=0.6
    twine>=5.1.1
    uv>=0.5
commands =
    uv build -q --sdist --wheel --out-dir {env_tmp_dir} .
    twine check {env_tmp_dir}{/}*
    check-wheel-contents --ignore W001,W002,W004,W009,W004 {env_tmp_dir}
