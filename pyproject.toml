[project]
name = "hope_dedup_engine"
version = "0.1.0"
description = "HOPE Deduplication Engine (HDE)"
readme = "README.md"
authors = [
    {name = "ddinicola"},
    {name = "Domenico DiNicola", email = "dom.dinicola@gmail.com"},
]
requires-python = "==3.12.*"
license = {text = "MIT"}

dependencies = [
    "celery[redis]",
    "deepface>=0.0.93",
    "Django",
    "django-admin-extra-buttons",
    "django-adminactions",
    "django-adminfilters",
    "django-celery-beat",
    "django-celery-boost==0.4.1",
    "django-celery-results>=2.5.1",
    "django-concurrency",
    "django-constance",
    "django-csp",
    "django-debug-toolbar",
    "django-environ>=0.11.2",
    "django-extensions",
    "django-filter",
    "django-flags>=5.0.13",
    "django-regex>=0.5.0",
    "django-storages[azure]",
    "django-smart-env>=0.1.0",
    "django-svelte-jsoneditor>=0.4.2",
    "djangorestframework",
    "drf-nested-routers>=0.94.2",
    "drf-spectacular[sidecar]",
    "flower>=2.0.1",
    "jsonschema>=4.23.0",
    "numpy>=1.26.4,<2.0.0",
    "psycopg2-binary>=2.9.9",
    "requests>=2.32.3",
    "ruff>=0.9.7",
    "sentry-sdk[celery,django]>=2.2.1",
    "setuptools>=74.1.2",
    "social-auth-app-django",
    "social-auth-core",
    "unicef-security",
    "tf-keras>=2.18.0",
]

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.5.36",
    "mkdocs-awesome-pages-plugin>=2.9.3",
    "mkdocstrings-python",
    "mkdocs-gen-files>=0.5.0",
    "mkdocs-panzoom-plugin>=0.1.3",
]

distribution = [
    "uwsgi>=2.0.28",
]

[tool.uv]
package = true
dev-dependencies = [
    "black",
    "django-webtest",
    "factory-boy",
    "faker",
    "flake8",
    "flake8-bugbear",
    "flake8-formatter-junit-xml",
    "flake8-html",
    "freezegun",
    "graphene-stubs",
    "ipdb",
    "isort",
    "mypy",
    "openpyxl-stubs",
    "pdbpp",
    "pre-commit",
    "pytest",
    "pytest-celery>=1.0.0",
    "pytest-cov",
    "pytest-django",
    "pytest-echo",
    "pytest-factoryboy>=2.7.0",
    "pytest-mock>=3.14.0",
    "pytest-xdist",
    "requests-mock",
    "responses>=0.25.0",
    "types-freezegun",
    "types-python-dateutil",
    "types-pytz",
    "types-redis",
    "types-requests",
    "unittest-xml-reporting",
    "watchdog",
]

[tool.setuptools.package-data]
"hope_dedup_engine" = ["web/templates/**/*", "web/static/**/*"]


[tool.isort]
profile = "black"
line_length = 120
default_section = "THIRDPARTY"
known_first_party = []
known_django = "django"
sections = ["FUTURE","STDLIB","DJANGO","THIRDPARTY","FIRSTPARTY","LOCALFOLDER"]
include_trailing_comma = true
skip = ["migrations", "snapshots", ".venv"]

[tool.django-stubs]
django_settings_module = "hope_dedup_engine.config.settings"

[tool.towncrier]
name = "Deduplication Engine"
directory = "changes"
package = "hope_dedup_engine"
filename = "CHANGELOG.md"
title_format = "{version}"
#template =
#issue_format = "`#{issue} <https://github.com/unicef/hope-dedup-engine/pull/{issue}>`_"
wrap = true


[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".mypy_cache",
    ".nox",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

line-length = 120
indent-width = 4

# Assume Python 3.12
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["F403",]

fixable = ["ALL"]
unfixable = []

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"

indent-style = "space"

skip-magic-trailing-comma = false

line-ending = "auto"

docstring-code-format = false

docstring-code-line-length = "dynamic"
