[build-system]
build-backend = "hatchling.build"
requires = [
  "hatch-vcs>=0.4",
  "hatchling>=1.25",
]

[project]
name = "hope-dedup-engine"
version = "1.15.0"
description = "HOPE Deduplication Engine (HDE)"
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Domenico DiNicola", email = "ddinicola@unicef.org" },
  { name = "Stefano Apostolico", email = "sapostolico@unicef.org" },
]
requires-python = ">=3.12,<3.13"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "celery[redis]",
  "celery-types",
  "deepface",
  "django<6",
  "django-admin-extra-buttons<2.3",
  "django-adminactions",
  "django-adminfilters",
  "django-celery-beat",
  "django-celery-boost",
  "django-celery-results",
  "django-concurrency",
  "django-constance",
  "django-csp",
  "django-environ",
  "django-extensions",
  "django-filter",
  "django-flags",
  "django-regex",
  "django-smart-env",
  "django-storages[azure]",
  "django-svelte-jsoneditor",
  "djangorestframework",
  "dlib",
  "drf-nested-routers",
  "drf-spectacular[sidecar]",
  "flower",
  "mediapipe",
  "numpy<2",
  "psycopg[binary]",
  "psycopg-pool",
  "python-ofiq",
  "requests",
  "sentry-sdk[celery,django]",
  "setuptools",
  "social-auth-app-django",
  "social-auth-core",
  "tf-keras",
  "ultralytics",
  "unicef-security",
  "uwsgi",
]
urls.Documentation = "https://unicef.github.io/hope-dedup-engine/"
urls.Homepage = "https://github.com/unicef/hope_dedup_engine"
urls.Issues = "https://github.com/unicef/hope-dedup-engine/issues"
urls.Repository = "https://github.com/unicef/hope-dedup-engine/"

[dependency-groups]
dev = [
  "black",
  "django-webtest",
  "factory-boy",
  "faker",
  "flake8",
  "flake8-bugbear",
  "flake8-formatter-junit-xml",
  "flake8-html",
  "freezegun",
  "graphene-stubs",
  "ipdb",
  "isort",
  "mypy",
  "openpyxl-stubs",
  "pdbpp",
  "pre-commit",
  "pytest",
  "pytest-celery",
  "pytest-cov",
  "pytest-django",
  "pytest-echo",
  "pytest-factoryboy",
  "pytest-mock",
  "pytest-xdist",
  "requests-mock",
  "responses",
  "ruff",
  "tox",
  "types-freezegun",
  "types-python-dateutil",
  "types-pytz",
  "types-redis",
  "types-requests",
  "unittest-xml-reporting",
  "watchdog",
]

docs = [
  "mkdocs",
  "mkdocs-awesome-pages-plugin",
  "mkdocs-gen-files",
  "mkdocs-material",
  "mkdocs-panzoom-plugin",
  "mkdocstrings-python",
]

[tool.hatch]
build.hooks.vcs.version-file = "src/hope_dedup_engine/version.py"
version.source = "vcs"
raw-options = { root = "../.." }

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.hatch.build.targets.sdist]
ignore-vcs = true
include = [
  "src/hope_dedup_engine/**/*.*",
]
exclude = [
  "~*",
]

[tool.hatch.build.targets.wheel]
packages = [
  "src/hope_dedup_engine",
]
exclude = [
  "~*",
]

[tool.uv]
package = true
